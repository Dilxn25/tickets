name: Reentrenar modelo de IA

# Se dispara desde el Panel de IA del sistema (boton "Reentrenar modelo") o a mano
# desde la pestana Actions de GitHub. Lee las ventas reales de la base de datos,
# entrena y deja una version fechada en euphoria-ia/modelos/ sin borrar la anterior.
on:
  workflow_dispatch:
    inputs:
      motivo:
        description: "Por que se reentrena (queda en el historial)"
        required: false
        default: "Reentrenamiento desde el panel"
      forzar:
        description: "Entrenar aunque haya pocas ventas"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  entrenar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn lightgbm joblib sqlalchemy pymysql cryptography

      - name: Apuntar el entrenamiento a la base de datos real
        env:
          URL_BD_ENTRENAMIENTO: ${{ secrets.URL_BD_ENTRENAMIENTO }}
        run: |
          if [ -z "$URL_BD_ENTRENAMIENTO" ]; then
            echo "::error::Falta el secreto URL_BD_ENTRENAMIENTO."
            echo ""
            echo "Se configura una sola vez en este repositorio:"
            echo "  Settings > Secrets and variables > Actions > New repository secret"
            echo "  Nombre: URL_BD_ENTRENAMIENTO"
            echo "  Valor:  mysql+pymysql://usuario:clave@host:puerto/defaultdb"
            echo ""
            echo "Los datos de conexion estan en el panel de Aiven."
            exit 1
          fi
          python - <<'PY'
          import json, os, re
          ruta = "recursos/modelo_entrenado/config.json"
          with open(ruta, encoding="utf-8") as f:
              cfg = json.load(f)

          # Se acepta la URL TAL CUAL la entrega Aiven y se adapta a lo que
          # entiende Python. Aiven da algo como:
          #   mysql://usuario:clave@host:puerto/defaultdb?ssl-mode=REQUIRED
          # y aca hacen falta dos ajustes:
          #   - el prefijo debe decir con que libreria se conecta (mysql+pymysql)
          #   - "ssl-mode" es del cliente de consola, no de Python: se descarta
          url = os.environ["URL_BD_ENTRENAMIENTO"].strip()

          if url.startswith("mysql://"):
              url = "mysql+pymysql://" + url[len("mysql://"):]
          elif "://" not in url:
              url = "mysql+pymysql://" + url

          if "?" in url:
              base, consulta = url.split("?", 1)
              partes = [t for t in consulta.split("&") if t]
              # se quitan los parametros que solo entiende el cliente de consola
              partes = [t for t in partes if not re.match(r"(?i)^(ssl-mode|sslmode)=", t)]
              url = base + ("?" + "&".join(partes) if partes else "")

          cfg["fuente"] = "mysql_prisma"
          cfg["database_url"] = url
          with open(ruta, "w", encoding="utf-8") as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)

          visible = re.sub(r"//[^@]+@", "//****@", url)
          print("Conexion preparada:", visible)
          PY

      - name: Probar la conexion a la base
        env:
          FORZAR: ${{ github.event.inputs.forzar }}
        run: |
          python - <<'PY'
          import json, os, sys
          from sqlalchemy import create_engine, text
          cfg = json.load(open("recursos/modelo_entrenado/config.json", encoding="utf-8"))
          try:
              eng = create_engine(cfg["database_url"], pool_pre_ping=True)
              with eng.connect() as con:
                  n = con.execute(text("SELECT COUNT(*) FROM detalle_comanda")).scalar()
              print("Conexion correcta. Lineas de venta disponibles:", n)
              minimo = 300
              forzar = os.environ.get("FORZAR", "false").lower() == "true"
              if n < minimo and not forzar:
                  print("::error::Hay %d lineas de venta y se piden al menos %d." % (n, minimo))
                  print("Entrenar con tan pocas ventas daria un modelo PEOR que el actual.")
                  print("Si aun asi quieres entrenar, lanza el flujo a mano con 'forzar' en true.")
                  sys.exit(1)
          except Exception as e:
              print("::error::No se pudo conectar a la base:", e)
              print("Revisa el secreto URL_BD_ENTRENAMIENTO (usuario, clave, host, puerto y nombre de la base).")
              sys.exit(1)
          PY

      - name: Entrenar y guardar la version fechada
        id: entrenamiento
        working-directory: recursos/modelo_entrenado
        run: |
          set -o pipefail
          python entrenar.py --versionar ../../euphoria-ia/modelos --conservar 6 2>&1 | tee salida.txt
          FICHA=$(grep '^FICHA' salida.txt | sed 's/^FICHA *-> *//')
          echo "ficha=$FICHA" >> "$GITHUB_OUTPUT"
          rm -f salida.txt

      - name: Dejar el config.json como estaba
        run: git checkout -- recursos/modelo_entrenado/config.json

      - name: Publicar el modelo nuevo
        run: |
          git config user.name "Entrenamiento automatico"
          git config user.email "actions@github.com"
          git add euphoria-ia/modelos recursos/modelo_entrenado/artefacto_modelo.pkl
          if git diff --staged --quiet; then
            echo "No hubo cambios que publicar."
            exit 0
          fi
          git commit -m "Modelo reentrenado: ${{ steps.entrenamiento.outputs.ficha }}"
          git push

      - name: Resumen
        run: |
          echo "### Modelo reentrenado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Motivo: ${{ github.event.inputs.motivo }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.entrenamiento.outputs.ficha }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
